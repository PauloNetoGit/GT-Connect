name: Gerar app Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      APP_ID: ${{ vars.APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar os arquivos do Android que faltam
        run: flutter create --org app --project-name pontegt1 --platforms android .

      - name: Configurar ID do app e assinatura
        run: dart run tools/preparar_android.dart "${APP_ID:-app.pontegt1}"

      - name: Instalar a chave de assinatura (se configurada)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Testes
        run: |
          flutter pub get
          flutter test

      - name: Gerar AAB (Play Store) e APK (instalar direto no celular)
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Aviso sobre assinatura
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: echo "::warning::Sem chave configurada. O APK serve para testar, mas a Play Store vai recusar este AAB. Veja o README."

      - uses: actions/upload-artifact@v4
        with:
          name: pedal-ponte
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar o APK em "Releases" (para baixar direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pedal Ponte (build ${{ github.run_number }})
          prerelease: true
          body: Toque em app-release.apk para baixar e instalar no celular.
          files: build/app/outputs/flutter-apk/app-release.apk
